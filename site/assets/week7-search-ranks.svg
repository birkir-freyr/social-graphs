<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" role="img" aria-labelledby="title desc">
<title id="title">The intended page changes rank when we change how text is searched</title>
<desc id="desc">Eight saved queries, four retrieval methods. Numbers give the rank of each predeclared target page. Black Widow ranks1,20,3,5. Doctor Strange ranks3,5,1,1. Spider-Man ranks3,4,6,1. Daredevil is absent from the corpus. Smaller ranks are better for locating that target; this is not complete relevance ground truth.</desc>
